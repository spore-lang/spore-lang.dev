[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v0.7.27"
hooks = [
  { id = "tombi-format", exclude = '^pnpm-lock\.yaml$' },
  { id = "tombi-lint" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.1.63"
hooks = [
  { id = "rumdl-fmt", exclude = '^\.github/styles/' },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.33.1"
hooks = [
  {
    id = "typos",
    args = ["--force-exclude"],
    exclude = '^\.github/styles/'
  },
]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.14.1"
hooks = [
  {
    id = "vale",
    args = ["--minAlertLevel=error"],
    files = '\.md$',
    exclude = '^\.github/styles/'
  },
]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "v0.15.1"
hooks = [
  {
    id = "lychee",
    args = ["--no-progress"],
    files = '\.md$',
    exclude = '^\.github/styles/'
  },
]

[[repos]]
repo = "https://github.com/zrr1999/zendev"
rev = "e2a5243899467d0df1cb1ab0ddcb18f3ef33d97b"
hooks = [
  { id = "zendev-commit-msg" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "pnpm-check",
    name = "pnpm-check",
    entry = "pnpm check",
    language = "system",
    pass_filenames = false,
    files = '^(package\.json|pnpm-workspace\.yaml|apps/[^/]+/(astro\.config\.(mjs|ts)|package\.json|tsconfig\.json|src/.*\.(astro|js|ts|md)))$'
  },
]
