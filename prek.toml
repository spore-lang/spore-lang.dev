default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "destroyed-symlinks" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.0"
hooks = [
  { id = "tombi-format", exclude = '^pnpm-lock\.yaml$' },
  { id = "tombi-lint" },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.0"
hooks = [
  { id = "rumdl-fmt", exclude = '^\.github/styles/' },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [
  { id = "actionlint" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [
  { id = "typos", args = ["--force-exclude"], exclude = '^\.github/styles/' },
]

[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.25.1"
hooks = [
  { id = "vale", args = ["--minAlertLevel=error"], files = '\.md$', exclude = '^\.github/styles/' },
]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  {
    id = "lychee",
    args = [
      "--no-progress",
      "--exclude=^https://spore-lang\\.dev/",
      "--exclude=^https://github\\.com/spore-lang/(spore|spore-evolution)(/.*)?$",
    ],
    files = '\.md$',
    exclude = '^\.github/styles/'
  },
]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.5.0"
hooks = [
  { id = "zendev-message-check", args = ["--profile", "zendev"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "pnpm-check", name = "pnpm-check", entry = "pnpm check", language = "system", pass_filenames = false, files = '^(package\.json|pnpm-workspace\.yaml|apps/[^/]+/(astro\.config\.(mjs|ts)|package\.json|tsconfig\.json|src/.*\.(astro|js|ts|md)))$' },
]
