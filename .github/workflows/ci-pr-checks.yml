name: "CI - PR Checks"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@7d8bcbf6134f62b7c7eaadb763f9a0d434717c44 # Shared message validation
        with:
          text: ${{ github.event.pull_request.title }}

  body:
    name: PR body
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check PR body
        uses: zendev-lab/zendev/actions/validate-body@7d8bcbf6134f62b7c7eaadb763f9a0d434717c44 # Shared Markdown scanner
        with:
          body: ${{ github.event.pull_request.body }}
